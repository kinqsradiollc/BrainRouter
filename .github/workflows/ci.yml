name: CI

# Runs on every push to main and every pull request targeting any branch.
# The PR trigger is the gate that protects main from broken merges; the
# push-to-main trigger catches anything that slipped through (force-pushes,
# bypass-protected admin merges, etc.).
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same PR when a new commit arrives — saves
# CI minutes and means the "latest" run is the one you care about. The
# main-branch ref is excluded so historical commits keep their green tick.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to least-privilege; individual jobs can widen if needed. Read is
# enough for build + test workflows that don't push artifacts.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # ADR-007 Phase 2 — Postgres + pgvector service so the PostgresMemoryStore
    # tests run for real in CI. Default creds match the store tests' fallback
    # URL (postgres://postgres:postgres@localhost:5432/postgres); each test
    # creates + drops its own scratch database.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        # Node 22.x only. `brainrouter/package.json` declares
        # `engines.node >= 22.0.0` — Node 20.x fails because:
        #   - `node:sqlite` was added in 22.5 (used in the memory store)
        #   - `node --test "dist/**/*.test.js"` glob expansion is 22+
        #   - JWT signature-tampering test relies on Node 22's
        #     crypto.timingSafeEqual behaviour for malformed inputs
        # When we want to broaden support, add `20.x` here *after* the
        # engines field is widened AND the above three are reworked.
        node-version: ['22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # `npm ci` is the deterministic install: refuses to run if
        # package-lock.json is out of sync, never mutates it. Faster than
        # `npm install` in CI because it skips dep resolution.
        run: npm ci
        env:
          # brainrouter-desktop devDeps include electron; CI only typechecks/
          # vite-builds it, so skip the ~100MB binary download per run.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build all workspaces
        # Root `build` fans out to every workspace via `npm run build -ws
        # --if-present`. Packages without a build script (none currently,
        # but covered) are skipped.
        run: npm run build

      - name: Run tests
        # Root `test` fans out via `-ws --if-present`. brainrouter uses
        # vitest, brainrouter-cli rebuilds + runs node --test, dashboard
        # has no test script and is skipped.
        run: npm run test
        env:
          NODE_NO_WARNINGS: '1'
          # ADR-007 Phase 2 — the brain now requires Postgres (SQLite removed).
          # Point at the pgvector service container; the brain's tests create +
          # drop their own scratch databases off this admin connection.
          BRAINROUTER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          BRAINROUTER_TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
