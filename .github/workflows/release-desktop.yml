name: Release — Desktop packages

# CP-B — the automated signed + notarized macOS build. Everything code-side is
# here; the ONLY thing you supply is your Apple Developer signing material as
# repository secrets (see the `env:` block + build/PACKAGING.md). Trigger it
# manually (Actions → "Release — Desktop" → Run workflow) or by pushing a
# release tag. It builds the per-arch (arm64 + x64) hardened-runtime app,
# signs it with your Developer ID cert, notarizes it via notarytool (the
# afterSign hook), and uploads the .dmg/.zip as artifacts. Without the secrets
# it still runs and produces an un-signed build (the notarize hook fails open),
# so the pipeline itself is verifiable before you add credentials.

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*', 'v*']

permissions:
  contents: write # upload release assets when triggered by a tag

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build signed macOS (arm64 + x64)
    runs-on: macos-14
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron runtime for browser qualification
        run: |
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD npm rebuild electron
          node -e "const fs=require('node:fs');const executable=require('electron');if(!fs.existsSync(executable))throw new Error('Electron runtime was not installed');console.log(executable)"

      - name: Build workspace deps (types + core)
        run: npm --prefix brainrouter-desktop run build:deps

      - name: Desktop regression suite
        run: npm test --workspace brainrouter-desktop

      - name: First-class browser Electron E2E
        run: npm run test:browser:e2e --workspace brainrouter-desktop -- --report "$PWD/brainrouter-desktop/.browser-benchmarks/release-e2e.json"

      - name: Enforce same-hardware Chrome comparison
        env:
          BRAINROUTER_BROWSER_STABLE_RUNNER: '1'
        run: npm run bench:browser:compare --workspace brainrouter-desktop -- --runs 20 --enforce-comparison --report "$PWD/brainrouter-desktop/.browser-benchmarks/release-comparison.json"

      - name: Upload browser qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brainrouter-browser-qualification
          path: brainrouter-desktop/.browser-benchmarks/release-*.json
          if-no-files-found: error
          include-hidden-files: true

      # Keep the browser qualification on the exact `npm ci` dependency tree.
      # Build-only tools stay out of the committed lockfile and are installed
      # only after runtime qualification has completed.
      - name: Install packaging tools
        run: npm install --no-save --workspace brainrouter-desktop electron-builder@26.15.3 @electron/notarize@3.1.1

      # electron-builder rejects node_modules symlinks that escape the app dir
      # (npm-workspace @kinqs/* links) — replace them with real copies first.
      - name: Dereference workspace deps for packaging
        run: node brainrouter-desktop/build/dereference-workspace-deps.mjs

      - name: Build + sign + notarize
        working-directory: brainrouter-desktop
        env:
          # Code-signing: a base64-encoded "Developer ID Application" .p12 and its
          # password. electron-builder imports it into a temporary keychain.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Notarization (read by build/notarize.cjs via notarytool):
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # GitHub expands an unset secret to an empty string. electron-builder
          # interprets an empty CSC_LINK as the working directory and fails
          # before it can exercise the documented unsigned-build fallback.
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npm run dist:mac

      - name: Verify the packaged build
        working-directory: brainrouter-desktop
        run: node scripts/verify-packaged.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: brainrouter-desktop-macos
          path: |
            brainrouter-desktop/release/*.dmg
            brainrouter-desktop/release/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release (tag triggers only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            brainrouter-desktop/release/*.dmg
            brainrouter-desktop/release/*.zip

  build-win:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install packaging tools
        run: npm install --no-save --workspace brainrouter-desktop electron-builder@26.15.3

      - name: Build workspace deps (types + core)
        run: npm --prefix brainrouter-desktop run build:deps

      # The complete workspace suite runs on every PR. This lane exercises the
      # Windows-specific desktop contracts and package graph on a real Windows
      # host; POSIX-only filesystem fixtures do not gate the Windows installer.
      - name: Windows desktop contracts
        run: |
          npm run typecheck --workspace brainrouter-desktop
          npm run build:electron --workspace brainrouter-desktop
          node --test brainrouter-desktop/dist-electron/host/terminalShells.test.js brainrouter-desktop/dist-electron/shellQuote.test.js brainrouter-desktop/dist-electron/windowSecurity.test.js
          node --import tsx --test brainrouter-desktop/src/styles/visualReleaseContract.test.ts

      - name: Dereference workspace deps for packaging
        run: node brainrouter-desktop/build/dereference-workspace-deps.mjs

      - name: Build Windows installer
        working-directory: brainrouter-desktop
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: brainrouter-desktop-windows-x64
          path: brainrouter-desktop/release/*.exe
          if-no-files-found: error

      - name: Attach Windows installer to GitHub Release (tag triggers only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: brainrouter-desktop/release/*.exe
