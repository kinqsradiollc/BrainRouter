<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 168" width="472" height="168" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Reasoning-effort slider: neutral grey below the top tier, lighting up purple with a dotted shimmer and a sweep at the top tier (Ultracode).">
  <defs>
    <pattern id="dots" width="4.5" height="4.5" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="0.9" fill="#8b82f0"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.40" stop-color="#6f63ee" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#cfc9ff" stop-opacity="0.85"/>
      <stop offset="0.60" stop-color="#6f63ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="trkA"><rect x="29" y="66" width="186" height="15" rx="7.5"/></clipPath>
    <clipPath id="trkB"><rect x="257" y="66" width="186" height="15" rx="7.5"/></clipPath>
  </defs>

  <rect x="0" y="0" width="472" height="168" rx="14" fill="#0e0f13"/>

  <!-- Popup A: neutral (Extra) -->
  <rect x="16" y="16" width="212" height="116" rx="11" fill="#181b22" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="29" y="40" font-size="12.5"><tspan fill="#f4f4f5" fill-opacity="0.6">Effort </tspan><tspan fill="#f4f4f5" font-weight="500">Extra</tspan></text>
  <circle cx="208" cy="36" r="7" fill="none" stroke="#333338"/>
  <text x="208" y="39.5" font-size="9" fill="#f4f4f5" fill-opacity="0.45" text-anchor="middle">?</text>
  <g clip-path="url(#trkA)">
    <rect x="29" y="66" width="186" height="15" fill="#333338"/>
    <rect x="29" y="66" width="109" height="15" fill="#f4f4f5" fill-opacity="0.30"/>
  </g>
  <g fill="#f4f4f5" fill-opacity="0.5">
    <circle cx="41" cy="73.5" r="1.6"/><circle cx="73" cy="73.5" r="1.6"/><circle cx="105" cy="73.5" r="1.6"/><circle cx="138" cy="73.5" r="1.6"/><circle cx="170" cy="73.5" r="1.6"/><circle cx="203" cy="73.5" r="1.6"/>
  </g>
  <rect x="131" y="64.5" width="14" height="18" rx="6" fill="#f5f5f5"/>
  <text x="29" y="101" font-size="11" fill="#f4f4f5" fill-opacity="0.55">Faster</text>
  <text x="215" y="101" font-size="11" fill="#f4f4f5" fill-opacity="0.55" text-anchor="end">Smarter</text>
  <text x="122" y="123" font-size="11" fill="#8e8e93" text-anchor="middle">Neutral grey below the top</text>

  <!-- Popup B: lit (Ultracode) -->
  <rect x="244" y="16" width="212" height="116" rx="11" fill="#181b22" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="257" y="40" font-size="12.5"><tspan fill="#f4f4f5" fill-opacity="0.6">Effort </tspan><tspan fill="#8b81f0" font-weight="500">Ultracode</tspan></text>
  <circle cx="436" cy="36" r="7" fill="none" stroke="#333338"/>
  <text x="436" y="39.5" font-size="9" fill="#f4f4f5" fill-opacity="0.45" text-anchor="middle">?</text>
  <g clip-path="url(#trkB)">
    <rect x="257" y="66" width="186" height="15" fill="#333338"/>
    <rect x="257" y="66" width="174" height="15" fill="#46426f"/>
    <rect x="257" y="66" width="174" height="15" fill="url(#dots)"/>
    <rect x="300" y="60" width="40" height="27" fill="url(#sweep)" transform="skewX(-18)"/>
  </g>
  <rect x="422" y="64.5" width="14" height="18" rx="6" fill="#f5f5f5"/>
  <text x="257" y="101" font-size="11" fill="#f4f4f5" fill-opacity="0.55">Faster</text>
  <text x="443" y="101" font-size="11" fill="#f4f4f5" fill-opacity="0.55" text-anchor="end">Smarter</text>
  <text x="350" y="123" font-size="11" fill="#8e8e93" text-anchor="middle">Lights up at the top tier</text>
</svg>
