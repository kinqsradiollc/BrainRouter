# ── BrainRouter FULL backend in Docker (production image) ──────────────────
# Runs MCP + REST + /v1 on :3747 and durable jobs (including CVE feed sync,
# repository scans, and future-CVE re-evaluation) in a separate worker, plus
# the Whisper STT sidecar — reusing your already-running host
# postgres + bge-reranker via host.docker.internal. Uses your real secrets from
# deploy/dev/.env (copied from brainrouter/.env, DB host rewritten).
#
#   cd deploy/dev
#   docker compose -f docker-compose.full.yml up -d --build
#   docker compose -f docker-compose.full.yml logs -f brain
#
# Code changed? Rebuild: `docker compose -f docker-compose.full.yml up -d --build brain`.
# (For LIVE-RELOAD instead — code edits reflect with no rebuild — run the
#  bind-mount + tsx-watch stack in docker-compose.dev.yml. That is the daily
#  driver; this file is for production-image parity.)
name: brainrouter-full

services:
  # One-shot: apply every pending DB migration before serving.
  migrator:
    build:
      context: ../..
      dockerfile: deploy/brain/Dockerfile
      target: migrator
    env_file: [.env]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  # First-party Whisper transcription.
  stt:
    build:
      context: ../stt
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      STT_PORT: "3752"
      WHISPER_MODEL: ${WHISPER_MODEL:-/models/ggml-base.en.bin}
      WHISPER_THREADS: ${WHISPER_THREADS:-}
    ports:
      - "127.0.0.1:3752:3752"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3752/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5

  # Optional read cache (CVE catalog, hot dashboard GETs). The brain degrades to
  # an in-process cache if this is absent — it is an accelerator, not a dependency.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # HTTP/MCP/model-gateway process (SERVICE defaults to `brain`). Async work is
  # delegated so feed refreshes and repository scans never delay API traffic.
  brain:
    build:
      context: ../..
      dockerfile: deploy/brain/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: [.env]
    environment:
      BRAINROUTER_JOB_RUNNER: "off"
      BRAINROUTER_STT_URL: ${BRAINROUTER_STT_URL:-http://stt:3752}
      BRAINROUTER_REDIS_URL: ${BRAINROUTER_REDIS_URL:-redis://redis:6379}
    ports:
      - "3747:3747"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Durable-job worker and vulnerability-sync responsibility. PostgreSQL queue
  # claims and per-source feed leases make additional replicas safe.
  worker:
    build:
      context: ../..
      dockerfile: deploy/brain/Dockerfile
      target: worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      BRAINROUTER_JOB_RUNNER: "on"
      BRAINROUTER_VULNERABILITY_SYNC: ${BRAINROUTER_VULNERABILITY_SYNC:-on}
      BRAINROUTER_STT_URL: ${BRAINROUTER_STT_URL:-http://stt:3752}
      BRAINROUTER_REDIS_URL: ${BRAINROUTER_REDIS_URL:-redis://redis:6379}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrator:
        condition: service_completed_successfully
      stt:
        condition: service_healthy
      redis:
        condition: service_healthy
